name: Build & publish

# Tests the game, exports a web build and a signed Android APK, then publishes
# both with the landing, help and privacy pages to the gh-pages branch
# (served at https://theramlakhan.com/word-glow/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          mv /tmp/tpl/templates/* "$dest/"

      - name: Put Godot on PATH
        run: |
          ln -sf ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run tests
        run: ./tests/run_all.sh

      - name: Check the levels are reproducible
        run: |
          godot --headless --path . -s res://tools/generate_levels.gd > /dev/null
          git diff --exit-code -- data/levels

      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else
            echo "::warning::No release keystore secret; signing with a throwaway key."
            KEYSTORE_PASSWORD=android; KEYSTORE_ALIAS=word-lantern
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android -alias word-lantern \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Word Glow"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          major_minor="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${major_minor}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Stamp version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"1.0.${{ github.run_number }}\"/" project.godot

      - name: Slim web engine (Brainnova)
        # 2D-only Godot web engine shared by every Brainnova game (smaller, faster to start).
        run: curl -fsSL https://raw.githubusercontent.com/ramlakhanmadheshiya/BrainnovaStudio/main/tools/slim-engine.sh | bash

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the share plugin (Android library)
        # Saves the share picture to the gallery and shares it (see plugins_src/wordlantern_share).
        run: |
          gradle -p plugins_src/wordlantern_share assembleRelease --no-daemon --stacktrace
          mkdir -p addons/wordlantern_share/bin
          cp plugins_src/wordlantern_share/build/outputs/aar/wordlantern_share-release.aar addons/wordlantern_share/bin/
          ls -l addons/wordlantern_share/bin

      - name: Real AdMob IDs (from secrets)
        # Without these secrets the builds keep Google's TEST ad units, which is
        # right for development but must not reach Play.
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_ID" ] || [ -z "$ADMOB_REWARDED_ID" ]; then
            echo "::warning::AdMob secrets not set: this build uses Google's TEST ad units. Add ADMOB_APP_ID, ADMOB_BANNER_ID and ADMOB_REWARDED_ID before releasing on Play."
            exit 0
          fi
          {
            echo ""
            echo "[admob]"
            echo ""
            echo "general/android/app_id=\"$ADMOB_APP_ID\""
            echo ""
            echo "[word_lantern]"
            echo ""
            echo "ads/android_banner_id=\"$ADMOB_BANNER_ID\""
            echo "ads/android_rewarded_id=\"$ADMOB_REWARDED_ID\""
            if [ -n "$ADMOB_INTERSTITIAL_ID" ]; then echo "ads/android_interstitial_id=\"$ADMOB_INTERSTITIAL_ID\""; fi
          } >> project.godot
          echo "Using the real AdMob app and ad units."

      - name: Export Android APK
        run: |
          mkdir -p build/android
          # Installs Godot's Gradle template, then the AdMob/Billing plugins patch it.
          godot --headless --path . --install-android-build-template --export-release "Android" build/android/word-glow.apk
          test -s build/android/word-glow.apk
          ls -lh build/android

      - name: Ship to Brainnova Studio
        # APK, web pack, help and privacy go to theramlakhan.com/BrainnovaStudio/games/word-glow/.
        # Also writes ./stubs: the old theramlakhan.com/word-glow/ addresses, redirecting.
        env:
          STUDIO_DEPLOY_KEY: ${{ secrets.STUDIO_DEPLOY_KEY }}
        run: curl -fsSL https://raw.githubusercontent.com/ramlakhanmadheshiya/BrainnovaStudio/main/tools/ship.sh | bash -s -- word-glow "1.0.${{ github.run_number }}"

      - name: Old addresses (gh-pages)
        # theramlakhan.com/word-glow/... now redirects to Brainnova Studio.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: stubs
          force_orphan: true
          commit_message: "Publish build ${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-glow-apk
          path: build/android/word-glow.apk

      - name: Export Android App Bundle (for Google Play)
        run: |
          godot --headless --path . --export-release "Android AAB" build/android/word-glow.aab
          test -s build/android/word-glow.aab

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-glow-aab
          path: build/android/word-glow.aab
